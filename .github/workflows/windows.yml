# Builds, tests and packages MemeLens on a real Windows machine. Nothing here needs a secret: the repo is public.
# The MSI is unsigned until the SignPath application is approved (docs/DESIGN.md, "Repos, licence and signing").
name: Windows

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      live_engine:
        description: "Also download the published engine through the installed app and run a backtest (needs the network)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and smoke on Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: node --version
      - run: npm ci
      # Electron 45 does not download its own binary when installed.
      - run: node node_modules/electron/install.js
      - name: Type check
        run: npm run typecheck:all
      - name: Unit tests
        run: npx vitest run
      - name: Smoke test of the real Electron app (sandbox ON, no --no-sandbox)
        run: node scripts/smoke-desktop.mjs

  package:
    name: MSI, install, run, uninstall
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build the MSI
        timeout-minutes: 15
        working-directory: apps/desktop
        run: node pack.mjs
      - name: Find the MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem apps/desktop/release -Filter *.msi
          if ($msi.Count -ne 1) { throw "expected exactly one MSI, found $($msi.Count)" }
          "MSI=$($msi.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "{0}  {1:N0} bytes" -f $msi.Name, $msi.Length
          (Get-FileHash $msi.FullName -Algorithm SHA256).Hash + "  sha256"
      - name: Install the MSI (silently, as the runner user)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$env:MSI`" /qn /norestart /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          "msiexec exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 60; throw "install failed" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", $env:ProgramFiles, ${env:ProgramFiles(x86)} -Recurse -Filter MemeLens.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "MemeLens.exe not found after install" }
          "EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "installed: $($exe.FullName)"
          Get-ChildItem $exe.DirectoryName | Select-Object Name, Length | Format-Table -AutoSize | Out-String -Width 200
          "version info: " + $exe.VersionInfo.ProductName + " " + $exe.VersionInfo.ProductVersion + " / " + $exe.VersionInfo.CompanyName
      - name: Load the sample data
        run: node --disable-warning=ExperimentalWarning --import tsx packages/data/src/bin.ts ingest packages/data/fixtures/sample.json --db "$env:RUNNER_TEMP\check.sqlite"
      - name: Run the INSTALLED app and look at it (no --no-sandbox)
        timeout-minutes: 12
        env:
          LIVE_ENGINE: ${{ inputs.live_engine && '--live-engine' || '' }}
        run: node scripts/check-packaged.mjs --exe "$env:EXE" --db "$env:RUNNER_TEMP\check.sqlite" --out "$env:RUNNER_TEMP\shots" $env:LIVE_ENGINE
      # The next four steps were one step. Runs 43218046784 and 43222454513 sat in it for 20+ minutes and ignored both a
      # cancel and the step's own time limit, with nothing in the log we could read. Four small steps, each with a limit
      # and timestamps, tell us which command stalls.
      - name: Before uninstall - what is running
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          function Say($m) { "{0:HH:mm:ss.fff} {1}" -f (Get-Date), $m }
          Say "image $env:ImageOS $env:ImageVersion"
          Say ("free memory (MB): " + [int]((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024))
          Say ("Windows Installer service: " + (Get-Service msiserver).Status)
          Say ("pending reboot flag: " + (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending'))
          Get-Process | Where-Object { $_.Name -match 'MemeLens|msiexec|crashpad|WerFault|TrustedInstaller' } | Select-Object Id, Name, StartTime | Format-Table -AutoSize | Out-String -Width 200
          Say "done"
      - name: Stop the app
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          function Say($m) { "{0:HH:mm:ss.fff} {1}" -f (Get-Date), $m }
          $k = Start-Process taskkill.exe -ArgumentList '/F', '/T', '/IM', 'MemeLens.exe' -PassThru -NoNewWindow
          if (-not $k.WaitForExit(30000)) { Say "taskkill did not return within 30 s"; Stop-Process -Id $k.Id -Force -ErrorAction SilentlyContinue; throw "taskkill stalled" }
          Say "taskkill exit code $($k.ExitCode) (128 = no such process, which is fine)"
          Start-Sleep -Seconds 2
          $left = @(Get-Process MemeLens -ErrorAction SilentlyContinue)
          Say "MemeLens processes left: $($left.Count)"
          if ($left.Count -gt 0) { $left | Select-Object Id, StartTime | Format-Table -AutoSize | Out-String -Width 200; throw "the app is still running" }
      - name: Uninstall
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: |
          function Say($m) { "{0:HH:mm:ss.fff} {1}" -f (Get-Date), $m }
          $log = "$env:RUNNER_TEMP\uninstall.log"
          Say "msiexec /x starts"
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$env:MSI`" /qn /norestart /l*v `"$log`"" -PassThru
          $null = $p.Handle   # keep the handle so ExitCode can be read after WaitForExit
          if (-not $p.WaitForExit(180000)) {
            Say "msiexec (pid $($p.Id)) did not finish within 3 minutes. Last lines of its log:"
            if (Test-Path $log) { Get-Content $log -Tail 40 } else { "(no log written)" }
            Get-Process | Where-Object { $_.Name -match 'msiexec|MemeLens|WerFault|TrustedInstaller' } | Select-Object Id, Name, StartTime | Format-Table -AutoSize | Out-String -Width 200
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "uninstall did not finish within 3 minutes"
          }
          Say "msiexec exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "uninstall failed" }
      - name: After uninstall - it is gone
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          if ($env:EXE -and (Test-Path $env:EXE)) { throw "MemeLens.exe is still there after uninstall: $env:EXE" }
          "uninstalled: $env:EXE is gone"
      - name: Keep the MSI, the pictures and the logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: memelens-windows
          path: |
            apps/desktop/release/*.msi
            ${{ runner.temp }}/shots/*.png
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/uninstall.log
          if-no-files-found: warn
          retention-days: 14
